- name: create ec2 instance and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: vinaydevops.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - roboshop-common
      - roboshop-{{ item }}
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output
  # - name: print ec2 creation output
  #   debug:
  #     msg: "{{ ec2_output }}"
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      override: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"


