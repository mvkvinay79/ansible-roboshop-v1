- name: configure catalouge server
  hosts: catalogue
  become: yes
  tasks:
  - name: disable defaulut node js
    command: dnf module disable nodejs -y
  
  - name: enable nodejs24
    command: dnf module enable nodejs:24 -y
  
  - name: install nodejs
    dnf:
      name: nodejs
      state: present
  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: robohop system user
      state: present
  - name: remove existing app directory
    file:
      path: /app
      state: absent

  - name: remove catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download catalogue app
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip

