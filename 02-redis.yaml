- name: configure redis server
  hosts: redis
  become: yes
  tasks:
  - name: enable redis 7
    command: dnf module enable redis:7 -y
  
  - name: isntall redis
    package:
      name: redis
      state: present

  - name: allow remote connection
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  - name: disble protected mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      line: 'protected-mode no'
  
  - name: start and enable redis
    service:
      name: redit
      state: restarted
      enabled: yes

